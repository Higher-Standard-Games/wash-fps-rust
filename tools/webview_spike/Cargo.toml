[package]
name = "webview_spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "W0 spike for docs/research/WEBVIEW_LOBBY.md: a wry child webview over a wgpu surface in one winit window"

# Not part of the game's build: its own workspace, its own lock.
[workspace]

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
wgpu = "30"
pollster = "0.4"
wry = "0.57.1"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
