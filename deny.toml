# cargo deny check: licenses, advisories, bans and sources for every dependency.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error, unmaintained, a build-time macro helper of gtk-rs 0.18,
  # which wry 0.57 needs on Linux. It goes when wry moves on.
  { id = "RUSTSEC-2024-0370", reason = "gtk-rs 0.18 through wry; no fixed version for GTK 3" },
]

[licenses]
version = 2
# washoi is MIT; shagger is MIT AND Apache-2.0 (its src/babylon/).
# Dependencies may use these permissive licenses; anything else fails CI.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  # webpki-roots (through shagger): the Mozilla CA list for wss:// (RUST.md 4.1).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# wry (shagger's webview feature, WEBVIEW_LOBBY.md) brings in a few Servo
# crates under MPL-2.0: file-level copyleft, used unmodified, so allowed for
# these crates only.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/Higher-Standard-Games/shagger"]
