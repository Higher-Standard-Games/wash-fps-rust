name: Lobby smoke

# W5 of docs/research/WEBVIEW_LOBBY.md: build the client on each desktop and
# open the live /client page in its webview (WebView2, WKWebView, WebKitGTK)
# until the page says hello over the bridge. The log and a screenshot are
# kept as artifacts.

on:
  workflow_dispatch:
    inputs:
      page:
        description: Lobby page (empty for eu.washoi.net/client)
        default: ""
  push:
    branches: [main]
    paths:
      - src/lobby_webview.rs
      - src/main.rs
      - src/window.rs
      - Cargo.lock
      - tools/lobby_smoke/**
      - .github/workflows/lobby_smoke.yml

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-0 mesa-vulkan-drivers xvfb imagemagick
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Smoke
        env:
          WASHOI_LOBBY_PAGE: ${{ inputs.page }}
        run: |
          exe=target/release/washoi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x720x24" tools/lobby_smoke/run.sh $exe out
          else
            tools/lobby_smoke/run.sh $exe out
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lobby-smoke-${{ matrix.runner }}
          path: |
            out/*.log
            out/*.png
