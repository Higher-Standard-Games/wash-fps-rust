name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # shagger is private: Cargo fetches it with git and the token below.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # cpal's ALSA backend (RUST.md 22.7) links libasound.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - run: cargo test

  # The lobby's documents (TERMS.md, CREDITS.md) are copies; wash-fps is the
  # master. Fails, naming the file, when a copy is outdated: run
  # tools/sync_docs.sh to copy it over.
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Higher-Standard-Games/wash-fps
          path: wash-fps-main
          sparse-checkout: |
            TERMS.md
            CREDITS.md
          sparse-checkout-cone-mode: false
      - run: tools/sync_docs.sh --check wash-fps-main

  # The game against the engine's main branch, not the pinned revision, so an
  # engine change that breaks the game shows up before the pin moves.
  engine-main:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Higher-Standard-Games/shagger
          path: shagger-main
      - name: Use the checked-out engine
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'TOML'
          [patch."https://github.com/Higher-Standard-Games/shagger"]
          shagger = { path = "shagger-main/crates/shagger" }
          shagger_shared = { path = "shagger-main/crates/shagger_shared" }
          TOML
      - uses: dtolnay/rust-toolchain@stable
      # cpal's ALSA backend (RUST.md 22.7) links libasound.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwebkit2gtk-4.1-dev
      - run: cargo test

  # Movement on the shipped maps: downloads them from the published data
  # (tools/fetch_maps.sh) and replays tests/golden/movement_maps.json. A map
  # update on the servers fails this job until the vectors are regenerated.
  shipped-maps:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # cpal's ALSA backend (RUST.md 22.7) links libasound.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v5
        with:
          path: target/washoi-maps/pk3
          key: washoi-maps-${{ hashFiles('tests/golden/movement_maps.json') }}
      - run: tools/fetch_maps.sh
      - run: cargo test --release --test movement_maps_golden
        env:
          WASHOI_MAPS: target/washoi-maps

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
