name: Release

# A tag v* builds the game for Linux (a tar.gz and an AppImage), macOS (Apple
# silicon and Intel) and Windows (a zip and an installer), packages each with tools/package.sh and
# attaches them to a draft GitHub release. Run by hand, it builds and keeps
# the packages as workflow artifacts only, unless the `release` input asks
# for the draft.
#
# Signing happens only when its secrets exist:
#   macOS    MACOS_CERTIFICATE (base64 .p12), MACOS_CERTIFICATE_PASSWORD,
#            MACOS_SIGN_IDENTITY ("Developer ID Application: ..."), and for
#            notarizing APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#   Windows  WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
# Without them the macOS app is ad-hoc signed and the Windows exe unsigned,
# which testers can still run (docs/research/RUST.md, "Unsigned builds").
# Set the repository variable REQUIRE_SIGNED to "true" to make a tag build
# fail without them.

on:
  push:
    tags: ["v*"]
  # Run by hand with `release` on main, it drafts the release v<Cargo.toml
  # version> itself; GitHub creates the tag when the draft is published.
  workflow_dispatch:
    inputs:
      release:
        description: Draft a release v<version> from this commit
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # A tag push, or a hand run on main that asks for the draft.
  RELEASING: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main') }}
  # tools/package.sh's Python prints paths; Windows' console code page
  # cannot encode every one.
  PYTHONUTF8: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the binary runs on older glibc.
          - runner: ubuntu-22.04
          # Apple silicon: macos-14 no longer gets a runner.
          - runner: macos-15
          # Intel: macos-13 is retired.
          - runner: macos-15-intel
          - runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A tag names the version the game reports: it must be Cargo.toml's.
      - name: Check the tag's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $cargo_version"
            exit 1
          fi
      # shagger is public: the sources come without a token.
      - name: Fetch the sources
        run: cargo fetch --locked
      # cpal's ALSA backend (RUST.md 22.7) links libasound.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwebkit2gtk-4.1-dev desktop-file-utils
      - uses: Swatinem/rust-cache@v2
      # Which signing secrets exist. Each secret reaches only the step that
      # uses it, never the build (crate build scripts run there).
      - name: Which secrets
        id: secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          echo "mac_cert=$([ -n "$MACOS_CERTIFICATE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "notarize=$([ -n "$APPLE_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "win_cert=$([ -n "$WINDOWS_CERTIFICATE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Refuse an unsigned release
        if: env.RELEASING == 'true' && vars.REQUIRE_SIGNED == 'true'
        run: |
          missing=""
          if [ "$RUNNER_OS" = macOS ] && [ "${{ steps.secrets.outputs.mac_cert }}" != true ]; then missing="MACOS_CERTIFICATE"; fi
          if [ "$RUNNER_OS" = macOS ] && [ "${{ steps.secrets.outputs.notarize }}" != true ]; then missing="$missing APPLE_ID"; fi
          if [ "$RUNNER_OS" = Windows ] && [ "${{ steps.secrets.outputs.win_cert }}" != true ]; then missing="WINDOWS_CERTIFICATE"; fi
          if [ -n "$missing" ]; then
            echo "::error::a release needs the signing secrets ($missing), or unset the variable REQUIRE_SIGNED"
            exit 1
          fi
      # macOS keeps debug info in the object files unless packed into a
      # dSYM, which crash reports need to be read.
      - if: runner.os == 'macOS'
        run: echo "CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=packed" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --offline
        env:
          WASHOI_BUILD: ${{ github.ref_name }} ${{ github.sha }}
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && steps.secrets.outputs.mac_cert == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
      - name: Sign the Windows exe
        if: runner.os == 'Windows' && steps.secrets.outputs.win_cert == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" /fd sha256 /tr http://timestamp.digicert.com /td sha256 target\release\washoi.exe
      # tools/package.sh builds the AppImage with appimagetool, pinned by hash.
      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          echo "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1  $RUNNER_TEMP/appimagetool" | sha256sum -c
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      # tools/package.sh builds the Windows installer with Inno Setup 6.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup --no-progress -y
          fi
      - name: Package
        run: |
          # A tag v1.2.3 names the packages 1.2.3; otherwise Cargo.toml's version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          tools/package.sh
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          MACOS_SIGN_IDENTITY: ${{ steps.secrets.outputs.mac_cert == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
      - name: Sign the Windows installer
        if: runner.os == 'Windows' && steps.secrets.outputs.win_cert == 'true'
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem dist\*-setup.exe | ForEach-Object {
            & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
          }
      - name: Notarize the macOS app
        if: runner.os == 'macOS' && steps.secrets.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for zip in dist/*.zip; do
            xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            dir=$(mktemp -d)
            ditto -x -k "$zip" "$dir"
            xcrun stapler staple "$dir/Washoi.app"
            rm "$zip"
            (cd "$dir" && ditto -c -k --keepParent Washoi.app "$GITHUB_WORKSPACE/$zip")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: washoi-${{ matrix.runner }}
          path: dist/*
      # The symbols for reading a crash's backtrace; not for players.
      # In a folder of its own, so the download keeps the bundle's name.
      - if: runner.os == 'macOS'
        run: mkdir -p symbols && cp -R target/release/washoi.dSYM symbols/
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.runner }}
          path: symbols

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
      - name: The release's tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: washoi-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Washoi ${{ steps.tag.outputs.name }}
          files: dist/*
