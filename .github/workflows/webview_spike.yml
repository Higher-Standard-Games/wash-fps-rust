name: Webview spike

# W0 of docs/research/WEBVIEW_LOBBY.md: build tools/webview_spike and run it
# on each desktop, once on the built-in lobby stand-in (with a local
# WebSocket echo server, hidden for 15 minutes in the long run) and once on
# the live game page. The reports and screenshots are kept as artifacts.
# By hand only; it is not part of CI.

on:
  workflow_dispatch:
    inputs:
      hidden_minutes:
        description: Minutes the stand-in stays hidden
        default: "15"

env:
  CARGO_TERM_COLOR: always

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
          - runner: macos-14
          - runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb imagemagick
      - name: Build
        working-directory: tools/webview_spike
        run: cargo build --release
      - name: Echo server
        run: |
          mkdir -p "$RUNNER_TEMP/echo" && cd "$RUNNER_TEMP/echo"
          npm init -y >/dev/null && npm install ws@8 >/dev/null
          cat > echo.cjs <<'EOF'
          const { WebSocketServer } = require("ws");
          const wss = new WebSocketServer({ port: 9555 });
          wss.on("connection", (s) => s.on("message", (m) => s.send(String(m))));
          EOF
          nohup node echo.cjs > echo.log 2>&1 &
          sleep 2
      - name: Run
        working-directory: tools/webview_spike
        run: |
          mkdir -p out/shots-standin out/shots-live
          exe=./target/release/webview_spike
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1280x720x24" "$@"; else "$@"; fi; }
          hidden=$(( ${{ inputs.hidden_minutes }} * 60 ))
          end=$(( 20 + hidden + 20 ))
          run $exe --ws ws://127.0.0.1:9555 --seconds $end --hide-at 20 --show-at $(( 20 + hidden )) \
            --shots out/shots-standin --report out/standin.json | tee out/standin.log | grep -v "page → native" || true
          run $exe --url https://eu.washoi.net/ --seconds 60 --hide-at 40 --show-at 50 \
            --shots out/shots-live --report out/live.json | tee out/live.log | grep -v "page → native" || true
          ls -la target/release/ out out/shots-*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-${{ matrix.runner }}
          path: tools/webview_spike/out
