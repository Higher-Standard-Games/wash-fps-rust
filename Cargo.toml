[package]
name = "washoi"
description = "Washoi, the native client: wash-fps ported to Rust on the SHAGGER engine."
license = "MIT"
version = "0.2.1"
publish = false
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/Higher-Standard-Games/wash-fps-rust"

[dependencies]
# Pinned engine revision. To work on both repositories at once, clone shagger
# next to this one and add, in an untracked .cargo/config.toml:
#   [patch."https://github.com/Higher-Standard-Games/shagger"]
#   shagger = { path = "../shagger/crates/shagger" }
#   shagger_shared = { path = "../shagger/crates/shagger_shared" }
shagger = { git = "https://github.com/Higher-Standard-Games/shagger", rev = "afa3c7a454f190ce51284e126e8c827afbf97a7a", features = ["webview"] }

# The window and its events for `washoi view` (RUST.md 12): winit 0.30, the
# release wgpu 30 and egui 0.37 work with. Without winit's drawn Wayland
# title bar (`wayland-csd-adwaita`), which pulls in the unmaintained
# ttf-parser (RUSTSEC-2026-0192); a game window does without it.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# PNG screenshots.
image = { version = "0.25", default-features = false, features = ["png"] }
# The lobby's room and welcome payloads, as the engine passes them on.
serde_json = "1"
# The self-update's check of the downloaded installer (update_check).
sha2 = "0.10"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Line tables only: a crash report's backtrace names functions and lines
# without full debug info's size.
[profile.release]
debug = "line-tables-only"
