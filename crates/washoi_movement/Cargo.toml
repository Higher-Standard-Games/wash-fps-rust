[package]
name = "washoi_movement"
description = "Washoi's movement simulation, headless: what the server and the client predict, for bots and servers too."
license = "MIT"
version = "1.0.3"
publish = false
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/Higher-Standard-Games/wash-fps-rust"

[dependencies]
# The client's pinned engine revision (the workspace's); only its headless half.
shagger_shared.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
